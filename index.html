<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Check">
<title>Trade Checklist — Forex Truth Finder</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root {
  --bg:#0f1117; --surface:#181b24; --surface2:#1e2130;
  --border:#2a2f42; --border2:#363c54;
  --text:#e8eaf0; --text2:#8890a8; --text3:#555e78;
  --accent:#4f8ef7; --accent2:#1a3a7a;
  --success:#2ecc71; --success2:#1a5c38;
  --danger:#e74c3c; --danger2:#5c1a1a;
  --warn:#f39c12; --warn2:#5c3a00;
  --r:10px; --rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;font-size:14px;line-height:1.5;overflow-x:hidden}

/* ── header ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border)}
.hdr-top{padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
.hdr-brand{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);text-transform:uppercase}
.hdr-title{font-size:15px;font-weight:700;color:var(--text)}

/* ── tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 6px;text-align:center;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none;letter-spacing:.03em}
.tab:active{background:var(--surface)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.locked{color:var(--text3);opacity:.45;cursor:default}
.tab-lock-icon{font-size:10px;display:block;margin-top:1px}

/* ── session bar ── */
.sbar{padding:9px 12px;display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--border);background:var(--surface)}
.sbar input,.sbar select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--rs);padding:7px 9px;font-size:13px;font-weight:600;outline:none;flex:1;min-width:0;font-family:inherit}
.sbar select{flex:0 0 auto;width:auto}

/* ── config panel ── */
.cfg-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cfg-panel h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cfg-label{font-size:13px;color:var(--text2);flex:1}
.cfg-hint{font-size:11px;color:var(--text3);display:block;margin-top:1px}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;border:none;outline:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.toggle.on::after{left:21px}
.cfg-divider{height:1px;background:var(--border);margin:2px 0}
.pair-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.chip.active{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.chip.del{color:var(--danger);border-color:var(--danger2);background:var(--danger2)}
.chip-add{background:var(--surface2);border:1px dashed var(--border2);color:var(--text3);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer}
.cfg-input-row{display:flex;gap:6px}
.cfg-input{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--rs);padding:7px 10px;font-size:13px;flex:1;outline:none;font-family:inherit}
.cfg-input:focus{border-color:var(--accent)}
.cfg-btn{background:var(--accent2);border:1px solid var(--accent);color:var(--accent);border-radius:var(--rs);padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}

/* ── banners ── */
.hard-stop{margin:8px 10px 0;padding:10px 13px;background:var(--danger2);border:1px solid var(--danger);border-radius:var(--rs);font-size:13px;font-weight:600;color:var(--danger);display:none}
.hard-stop.show{display:block}
.probe-banner{margin:6px 10px 0;padding:9px 13px;border-radius:var(--rs);font-size:12px;font-weight:600;display:none;align-items:center;gap:8px}
.probe-banner.show{display:flex}
.probe-banner.full{background:#1a3a7a;border:1px solid #4f8ef7;color:#b8d0ff}
.probe-banner.reduced{background:var(--warn2);border:1px solid var(--warn);color:var(--warn)}
.entry-locked-banner{margin:8px 10px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);text-align:center;display:none}
.entry-locked-banner.show{display:block}
.entry-locked-banner p{font-size:13px;color:var(--text3);margin-bottom:6px}
.entry-locked-banner strong{color:var(--danger);font-size:12px}

/* ── progress ── */
.prog-wrap{padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.prog-track{height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s ease;width:0%}
.prog-fill.setup{background:var(--accent)}
.prog-fill.entry{background:var(--success)}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px}

/* ── sections ── */
.sec{margin:10px 10px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.sec-hdr{padding:11px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sec-hdr:active{background:var(--surface2)}
.sec-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.sec-badge{display:flex;align-items:center;gap:6px;margin-left:auto}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.badge.done{background:var(--success2);color:var(--success)}
.badge.blocked{background:var(--danger2);color:var(--danger)}
.sec-body{border-top:1px solid var(--border)}

/* ── conditions ── */
.cond{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
.cond:last-child{border-bottom:none}
.cond-top{display:flex;align-items:flex-start;gap:10px}
.cond-icon{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.cond-icon.bull{border-color:var(--success);background:var(--success2);color:var(--success)}
.cond-icon.bear{border-color:var(--danger);background:var(--danger2);color:var(--danger)}
.cond-icon.neut{border-color:var(--warn);background:var(--warn2);color:var(--warn)}
.cond-icon.block{border-color:var(--danger);background:var(--danger2);color:var(--danger)}
.cond-txt{flex:1;font-size:13px;color:var(--text);line-height:1.4}
.cond-txt small{display:block;font-size:11px;color:var(--text3);margin-top:2px}

/* ── answer buttons ── */
.ans-grp{display:flex;gap:5px;flex-wrap:wrap}
.abtn{border:1px solid var(--border2);background:var(--surface2);color:var(--text2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.abtn:active{transform:scale(.96)}
.abtn.sel-bull{background:var(--success2);border-color:var(--success);color:var(--success)}
.abtn.sel-bear{background:var(--danger2);border-color:var(--danger);color:var(--danger)}
.abtn.sel-neut{background:var(--warn2);border-color:var(--warn);color:var(--warn)}
.abtn.sel-block{background:var(--danger2);border-color:var(--danger);color:var(--danger)}

/* ── multi-select ── */
.multi-grp{display:flex;flex-direction:column;gap:5px}
.mchk{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all .15s}
.mchk.checked{background:var(--accent2);border-color:var(--accent)}
.mchk-box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.mchk.checked .mchk-box{background:var(--accent);border-color:var(--accent);color:#fff}
.mchk-lbl{font-size:12px;color:var(--text2);flex:1;line-height:1.3}
.mchk.checked .mchk-lbl{color:var(--text)}

/* ── auto pill ── */
.auto-result{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-top:2px}
.auto-result.bull{background:var(--success2);color:var(--success);border:1px solid var(--success)}
.auto-result.neut{background:var(--warn2);color:var(--warn);border:1px solid var(--warn)}
.auto-result.block{background:var(--danger2);color:var(--danger);border:1px solid var(--danger)}
.auto-result.pending{background:var(--surface2);color:var(--text3);border:1px solid var(--border2)}

/* ── summary ── */
.sum-sec{margin:10px 10px 16px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.sum-hdr{background:var(--surface);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.sum-hdr h2{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.out-pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.04em}
.out-TAKE-TRADE{background:#1a5c38;color:#2ecc71}
.out-TAKE-TRADE-REDUCED{background:#2a4a1a;color:#8fdd60}
.out-WAIT{background:#4a3800;color:#f39c12}
.out-NO-TRADE{background:#7a0f0f;color:#ff6b6b}
.out-PENDING{background:var(--surface2);color:var(--text3)}
.out-ENTER{background:#1a5c38;color:#2ecc71}
.out-ENTER-WAIT{background:#4a3800;color:#f39c12}
.out-NO-ENTRY{background:#7a0f0f;color:#ff6b6b}
.sum-body{background:var(--surface);border-top:1px solid var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.score-row{display:flex;align-items:center;gap:10px}
.score-lbl{font-size:12px;color:var(--text2);width:56px;flex-shrink:0}
.score-track{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden;position:relative}
.score-fill-inner{height:100%;border-radius:3px;transition:width .4s ease;background:var(--accent)}
.score-val{font-size:12px;font-weight:600;color:var(--text);width:32px;text-align:right;flex-shrink:0}
.sum-items{display:flex;flex-direction:column;gap:4px}
.sum-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);padding:3px 0}
.sbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.sbadge.b{background:var(--success2);color:var(--success)}
.sbadge.s{background:var(--danger2);color:var(--danger)}
.sbadge.n{background:var(--warn2);color:var(--warn)}
.sbadge.p{background:var(--surface2);color:var(--text3)}
.sum-note{font-size:13px;color:var(--text2);line-height:1.6;background:var(--surface2);border-radius:var(--rs);padding:10px 12px;border-left:3px solid var(--accent);white-space:pre-wrap;word-break:break-word}

/* ── actions ── */
.actions{padding:10px 14px 28px;display:flex;gap:8px}
.btn{border:1px solid var(--border2);background:var(--surface2);color:var(--text2);border-radius:var(--rs);padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;flex:1;text-align:center;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent2);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ── toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;transition:transform .25s ease;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* spacer */
.spacer{height:10px}
</style>
</head>
<body>

<!-- install banner -->
<div id="installBanner" style="display:none;align-items:center;gap:10px;padding:10px 14px;background:#1a3a7a;border-bottom:1px solid #4f8ef7">
  <span style="flex:1;font-size:13px;color:#b8d0ff">Add to home screen for the best experience</span>
  <button onclick="doInstall()" style="background:#4f8ef7;border:none;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Install</button>
  <button onclick="document.getElementById('installBanner').style.display='none'" style="background:none;border:none;color:#4f8ef7;font-size:18px;cursor:pointer;padding:0 2px">×</button>
</div>

<div class="hdr">
  <div class="hdr-top">
    <div><div class="hdr-brand">Forex Truth Finder</div><div class="hdr-title">Trade Checklist</div></div>
    <button class="btn" style="flex:0;padding:7px 12px;font-size:12px" onclick="toggleConfig()">⚙</button>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-setup" onclick="switchTab('setup')">Setup</div>
    <div class="tab locked" id="tab-entry" onclick="switchTab('entry')">
      Entry<span class="tab-lock-icon" id="entryLockIcon">🔒</span>
    </div>
    <div class="tab" id="tab-config" onclick="switchTab('config')">Config</div>
  </div>
</div>

<!-- session bar -->
<div class="sbar" id="sessionBar">
  <select id="pairSelect" onchange="onPairSelect()">
    <option value="">Pair</option>
  </select>
  <select id="dirSelect" onchange="saveSession();renderAll()">
    <option value="">Dir</option>
    <option value="LONG">Long</option>
    <option value="SHORT">Short</option>
  </select>
  <select id="tfPairSelect" onchange="saveSession();renderAll()">
    <option value="">TF Pair</option>
  </select>
</div>

<!-- config panel -->
<div id="configPanel" style="display:none">
  <div class="cfg-panel">
    <h3>Pairs</h3>
    <div class="pair-chips" id="pairChips"></div>
    <div class="cfg-input-row">
      <input class="cfg-input" id="newPairInput" placeholder="Add pair e.g. GBPUSD" maxlength="10">
      <button class="cfg-btn" onclick="addPair()">Add</button>
    </div>

    <div class="cfg-divider"></div>
    <h3>Timeframe pairs</h3>
    <div class="pair-chips" id="tfChips"></div>
    <div class="cfg-input-row">
      <input class="cfg-input" id="newTfInput" placeholder="e.g. H4→M15">
      <button class="cfg-btn" onclick="addTF()">Add</button>
    </div>

    <div class="cfg-divider"></div>
    <h3>Setup conditions</h3>
    <div id="setupToggles"></div>

    <div class="cfg-divider"></div>
    <h3>Entry conditions</h3>
    <div id="entryToggles"></div>

    <div class="cfg-divider"></div>
    <button class="btn" style="color:var(--danger);border-color:var(--danger2);background:var(--danger2)" onclick="resetAll()">↺ Reset all answers</button>
  </div>
</div>

<div id="pageContent"></div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   DEFINITIONS
══════════════════════════════════════════ */
const PERM_TF = {'H4→M15':'Daily','H1→M5':'H4','Daily→H1':'Weekly','Weekly→H4':'Monthly','M15→M1':'H1'};

const SETUP_CONDITIONS = [
  { id:'g1',  section:'Gate 1 — HTF Permission',    label:'Permission TF — 21 EMA position',
    hint:'Price must be on the correct side of the 21 EMA on the permission timeframe',
    answers:['Pass — correct side ✓','Fail — wrong side ✗'], biases:['bull','block'],
    stored:['pass','fail'] },

  { id:'cl',  section:'Gate 2 — HTF Candle Language', label:'Read the last 2–5 candles and classify',
    hint:'Supportive = with trade direction · Neutral/Unclear = no clear story · Contradictory = hard stop',
    answers:['Supportive','Neutral','Unclear','Contradictory'], biases:['bull','neut','neut','block'],
    stored:['Supportive','Neutral','Unclear','Contradictory'] },

  { id:'et',  section:'Section 3 — EMA Touch',      label:'Price within 0.25 × ATR(14) of 21 EMA on setup TF',
    hint:'Also valid if price briefly trades beyond EMA then returns. Broken = full closed candle on wrong side, no EMA touch',
    answers:['Valid touch ✓','Too far from EMA','EMA broken ✗'], biases:['bull','neut','block'],
    stored:['valid','too-far','broken'] },

  { id:'sc',  section:'Section 4 — Setup Classification', label:'Confluence present alongside EMA touch?',
    hint:'Tick all that apply — any tick = A+ setup',
    type:'multi',
    options:[
      {key:'sr_sup',  label:'Previous resistance now acting as support'},
      {key:'sr_res',  label:'Previous support now acting as resistance'},
      {key:'hl_sup',  label:'Previous Higher Low acting as support (uptrend)'},
      {key:'lh_res',  label:'Previous Lower High acting as resistance (downtrend)'},
      {key:'sweep_swing', label:'Sweep of a previous swing high or low'},
      {key:'sweep_int',   label:'Sweep of internal swing formed during pullback'},
      {key:'counter_str', label:'Small counter-trend structure into EMA'},
    ]},

  { id:'rb',  section:'Roadblock (½ weight)',        label:'Untested HL/LH roadblock beyond standard target?',
    hint:'Isolated structural HL (sells) or LH (buys) that no confirmed swing has returned to — extended target opportunity',
    answers:['Yes — identified','No roadblock'], biases:['bull','neut'],
    stored:['yes','no'] },
];

const ENTRY_CONDITIONS = [
  { id:'ema_etf', section:'Step 1 — Entry TF EMA Break', label:'Entry TF 21 EMA broken (closed candle rule)',
    hint:'Full candle opened AND closed on opposite side, never touched EMA — not a wick, not in-progress candle',
    answers:['Confirmed ✓','Not yet','Invalidated ✗'], biases:['bull','neut','block'],
    stored:['yes','no','invalid'] },

  { id:'etype',  section:'Step 2 — Confirmation Type',   label:'Which entry confirmation applies?',
    hint:'Type 1: structure break + EMA break. Type 2: when structure break > 2.5× distance from EMA break',
    answers:['Type 1 — Structure break','Type 2 — 1-2-3 move'], biases:['bull','bull'],
    stored:['type1','type2'] },

  { id:'struct', section:'Step 2 — Confirmation Type',   label:'Type 1: Structure break confirmed?',
    hint:'Even a 1-pip wick through a previous Higher Low (sell) or Lower High (buy) on the entry TF qualifies',
    answers:['Yes — broken ✓','Not yet','N/A — using Type 2'], biases:['bull','neut','neut'],
    stored:['yes','no','na'] },

  { id:'s123',   section:'Step 2 — Confirmation Type',   label:'Type 2: 1-2-3 sequence complete?',
    hint:'Step 1: move in trade direction · Step 2: pullback · Step 3: new LL (sell) or HH (buy)',
    answers:['Complete ✓','In progress','N/A — using Type 1'], biases:['bull','neut','neut'],
    stored:['yes','no','na'] },

  { id:'entry_opt', section:'Step 3 — Entry Option',     label:'Entry level reached?',
    hint:'Option 1: pullback to entry TF 21 EMA (0.25×ATR rule applies) · Option 2: retest of broken structural level — take whichever appears first',
    answers:['EMA pullback reached','Structure retest reached','Neither — waiting'], biases:['bull','bull','neut'],
    stored:['ema','retest','waiting'] },

  { id:'stop',  section:'Step 4 — Stop Loss',            label:'Stop loss defined?',
    hint:'BUY: below last swing low — no buffer. SELL: above last swing high + spread + 1pip buffer (measured at entry)',
    answers:['Placed ✓','Not placed yet'], biases:['bull','neut'],
    stored:['yes','no'] },
];

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let cfg = {
  pairs: ['EURUSD','GBPUSD','USDJPY','XAUUSD','GBPJPY'],
  tfPairs: ['H4→M15','H1→M5','Daily→H1','Weekly→H4','M15→M1'],
  setupEnabled: {g1:true, cl:true, et:true, sc:true, rb:true},
  entryEnabled: {ema_etf:true, etype:true, struct:true, s123:true, entry_opt:true, stop:true},
};
let session = { pair:'', dir:'', tfPair:'' };
let setupSt  = { g1:null, cl:null, et:null, sc:[], rb:null };
let entrySt  = { ema_etf:null, etype:null, struct:null, s123:null, entry_opt:null, stop:null };
let currentTab = 'setup';
let configOpen = false;

function saveAll() {
  localStorage.setItem('ftf_cfg', JSON.stringify(cfg));
  localStorage.setItem('ftf_session', JSON.stringify(session));
  localStorage.setItem('ftf_setup', JSON.stringify(setupSt));
  localStorage.setItem('ftf_entry', JSON.stringify(entrySt));
}
function loadAll() {
  try { const c = localStorage.getItem('ftf_cfg'); if(c) cfg = {...cfg, ...JSON.parse(c)}; } catch(e){}
  try { const s = localStorage.getItem('ftf_session'); if(s) session = JSON.parse(s); } catch(e){}
  try { const s = localStorage.getItem('ftf_setup'); if(s) setupSt = JSON.parse(s); } catch(e){}
  try { const e = localStorage.getItem('ftf_entry'); if(e) entrySt = JSON.parse(e); } catch(e){}
}
function saveSession() {
  session.pair   = document.getElementById('pairSelect').value;
  session.dir    = document.getElementById('dirSelect').value;
  session.tfPair = document.getElementById('tfPairSelect').value;
  saveAll();
}

/* ══════════════════════════════════════════
   SETUP GATE LOGIC
══════════════════════════════════════════ */
function getSetupVerdict() {
  const g1ok  = setupSt.g1 === 'pass';
  const g1fail= setupSt.g1 === 'fail';
  const clCls = setupSt.cl === 'Supportive' ? 'full' : setupSt.cl === 'Contradictory' ? 'none' : setupSt.cl ? 'reduced' : null;
  const etOk  = setupSt.et === 'valid';
  const etFail= setupSt.et === 'broken';
  const setupClass = etOk ? (setupSt.sc.length > 0 ? 'A+' : 'A') : null;
  const hardStop = g1fail || clCls === 'none';

  let probe = null;
  if (!hardStop && etOk && clCls) {
    if (clCls === 'full') probe = setupClass === 'A+' ? 'A+ Full' : 'A Normal';
    else probe = setupClass === 'A+' ? 'A (reduced from A+)' : 'A Normal';
  }

  let verdict, vclass;
  if (!setupSt.g1) { verdict='Pending'; vclass='PENDING'; }
  else if (hardStop) { verdict='No Trade'; vclass='NO-TRADE'; }
  else if (!etOk) { verdict='Wait'; vclass='WAIT'; }
  else if (clCls === 'full') { verdict=setupClass==='A+' ? 'Take Trade — A+' : 'Take Trade — A'; vclass='TAKE-TRADE'; }
  else if (clCls === 'reduced') { verdict=setupClass==='A+' ? 'Reduced Probe — A+' : 'A Normal'; vclass='TAKE-TRADE-REDUCED'; }
  else { verdict='Pending'; vclass='PENDING'; }

  return { g1ok, g1fail, clCls, etOk, etFail, setupClass, hardStop, probe, verdict, vclass };
}

function setupPassed() {
  const v = getSetupVerdict();
  return v.vclass === 'TAKE-TRADE' || v.vclass === 'TAKE-TRADE-REDUCED';
}

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
function switchTab(tab) {
  if (tab === 'entry' && !setupPassed()) return;
  currentTab = tab;
  ['setup','entry','config'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t === tab);
  });
  configOpen = tab === 'config';
  document.getElementById('configPanel').style.display = tab === 'config' ? 'block' : 'none';
  renderAll();
}

function toggleConfig() {
  switchTab(currentTab === 'config' ? 'setup' : 'config');
}

function updateTabLock() {
  const locked = !setupPassed();
  const tabEl = document.getElementById('tab-entry');
  tabEl.classList.toggle('locked', locked);
  document.getElementById('entryLockIcon').style.display = locked ? 'block' : 'none';
  if (locked && currentTab === 'entry') switchTab('setup');
}

/* ══════════════════════════════════════════
   SESSION BAR
══════════════════════════════════════════ */
function populateSessionBar() {
  const ps = document.getElementById('pairSelect');
  const tfp = document.getElementById('tfPairSelect');
  ps.innerHTML = '<option value="">Pair</option>';
  cfg.pairs.forEach(p => { const o = document.createElement('option'); o.value=p; o.textContent=p; if(p===session.pair) o.selected=true; ps.appendChild(o); });
  tfp.innerHTML = '<option value="">TF Pair</option>';
  cfg.tfPairs.forEach(t => { const o = document.createElement('option'); o.value=t; o.textContent=t; if(t===session.tfPair) o.selected=true; tfp.appendChild(o); });
  document.getElementById('dirSelect').value = session.dir || '';
}
function onPairSelect() { saveSession(); renderAll(); }

/* ══════════════════════════════════════════
   CONFIG PANEL RENDER
══════════════════════════════════════════ */
function renderConfig() {
  // Pair chips
  const pc = document.getElementById('pairChips'); pc.innerHTML='';
  cfg.pairs.forEach(p => {
    const c = document.createElement('span'); c.className='chip' + (p === session.pair ? ' active':'');
    c.textContent = p;
    c.onclick = () => { document.getElementById('pairSelect').value=p; session.pair=p; saveAll(); renderConfig(); };
    pc.appendChild(c);
    const d = document.createElement('span'); d.className='chip del'; d.textContent='×';
    d.onclick = (e) => { e.stopPropagation(); cfg.pairs=cfg.pairs.filter(x=>x!==p); if(session.pair===p) session.pair=''; saveAll(); populateSessionBar(); renderConfig(); };
    pc.appendChild(d);
  });

  // TF chips
  const tc = document.getElementById('tfChips'); tc.innerHTML='';
  cfg.tfPairs.forEach(t => {
    const c = document.createElement('span'); c.className='chip' + (t === session.tfPair ? ' active':'');
    c.textContent = t;
    c.onclick = () => { document.getElementById('tfPairSelect').value=t; session.tfPair=t; saveAll(); renderConfig(); };
    tc.appendChild(c);
    const d = document.createElement('span'); d.className='chip del'; d.textContent='×';
    d.onclick = (e) => { e.stopPropagation(); cfg.tfPairs=cfg.tfPairs.filter(x=>x!==t); if(session.tfPair===t) session.tfPair=''; saveAll(); populateSessionBar(); renderConfig(); };
    tc.appendChild(d);
  });

  // Setup toggles
  const st = document.getElementById('setupToggles'); st.innerHTML='';
  SETUP_CONDITIONS.forEach(c => {
    if (!cfg.setupEnabled.hasOwnProperty(c.id)) cfg.setupEnabled[c.id] = true;
    st.appendChild(makeToggleRow(c.label, cfg.setupEnabled[c.id], (v) => { cfg.setupEnabled[c.id]=v; saveAll(); renderAll(); }));
  });

  // Entry toggles
  const et = document.getElementById('entryToggles'); et.innerHTML='';
  ENTRY_CONDITIONS.forEach(c => {
    if (!cfg.entryEnabled.hasOwnProperty(c.id)) cfg.entryEnabled[c.id] = true;
    et.appendChild(makeToggleRow(c.label, cfg.entryEnabled[c.id], (v) => { cfg.entryEnabled[c.id]=v; saveAll(); renderAll(); }));
  });
}

function makeToggleRow(label, val, onChange) {
  const row = document.createElement('div'); row.className='cfg-row'; row.style.marginBottom='8px';
  const lbl = document.createElement('span'); lbl.className='cfg-label'; lbl.textContent=label;
  const btn = document.createElement('button'); btn.className='toggle'+(val?' on':'');
  btn.onclick = () => { const nv=!val; onChange(nv); };
  row.appendChild(lbl); row.appendChild(btn);
  return row;
}

function addPair() {
  const v = document.getElementById('newPairInput').value.trim().toUpperCase();
  if (!v) return;
  if (!cfg.pairs.includes(v)) { cfg.pairs.push(v); saveAll(); populateSessionBar(); renderConfig(); }
  document.getElementById('newPairInput').value='';
}
function addTF() {
  const v = document.getElementById('newTfInput').value.trim();
  if (!v) return;
  if (!cfg.tfPairs.includes(v)) { cfg.tfPairs.push(v); saveAll(); populateSessionBar(); renderConfig(); }
  document.getElementById('newTfInput').value='';
}

/* ══════════════════════════════════════════
   RENDER ALL
══════════════════════════════════════════ */
function renderAll() {
  updateTabLock();
  populateSessionBar();
  if (currentTab === 'config') { renderConfig(); document.getElementById('pageContent').innerHTML=''; return; }
  if (currentTab === 'setup') renderSetup();
  if (currentTab === 'entry') renderEntry();
}

/* ══════════════════════════════════════════
   SETUP TAB
══════════════════════════════════════════ */
function renderSetup() {
  const v = getSetupVerdict();
  const container = document.getElementById('pageContent');
  container.innerHTML = '';

  // Hard stop banner
  if (v.hardStop) {
    const hs = document.createElement('div'); hs.className='hard-stop show';
    hs.textContent = v.g1fail ? '⛔ Gate 1 failed — price on wrong side of permission TF EMA. No trade.' : '⛔ Gate 2 failed — candle language is Contradictory. No trade.';
    container.appendChild(hs);
  }
  // Probe banner
  if (!v.hardStop && v.probe) {
    const pb = document.createElement('div');
    pb.className = 'probe-banner show ' + (v.clCls === 'full' ? 'full' : 'reduced');
    pb.textContent = (v.clCls === 'full' ? '✦ ' : '▲ ') + v.probe + ' Probe';
    container.appendChild(pb);
  }

  // Progress
  const enabled = SETUP_CONDITIONS.filter(c => cfg.setupEnabled[c.id] !== false);
  const answered = enabled.filter(c => {
    if (c.type === 'multi') return setupSt.et === 'valid'; // sc only counts if ET done
    return setupSt[c.id] !== null && setupSt[c.id] !== undefined;
  });
  const pct = enabled.length ? Math.round(answered.length / enabled.length * 100) : 0;
  const prog = makeProgress(answered.length, enabled.length, pct, 'setup');
  container.appendChild(prog);

  // Sections
  let lastSection = '';
  SETUP_CONDITIONS.forEach(cond => {
    if (cfg.setupEnabled[cond.id] === false) return;
    if (cond.section !== lastSection) {
      lastSection = cond.section;
      const sec = document.createElement('div'); sec.className='sec';
      const hdr = document.createElement('div'); hdr.className='sec-hdr';
      hdr.style.cursor='default';
      const isDone = sectionDoneSetup(cond.section);
      const isBlocked = (cond.section.includes('Gate 1') && v.g1fail) || (cond.section.includes('Gate 2') && v.clCls === 'none');
      hdr.innerHTML = `<span class="sec-lbl">${cond.section}</span><div class="sec-badge"><span class="badge ${isDone?'done':''} ${isBlocked?'blocked':''}">${isDone?(isBlocked?'✗':'✓'):'—'}</span></div>`;
      sec.appendChild(hdr);
      const body = document.createElement('div'); body.className='sec-body';
      sec.appendChild(body);
      container.appendChild(sec);
    }
    const body = container.lastChild.querySelector('.sec-body');

    if (cond.type === 'multi') {
      body.appendChild(renderMultiCond(cond));
    } else {
      const currentLabel = getCurrentLabel(cond, setupSt[cond.id]);
      body.appendChild(makeCond(cond, currentLabel, (val) => {
        setupSt[cond.id] = val ? cond.stored[cond.answers.indexOf(val)] : null;
        saveAll(); renderAll();
      }));
    }
  });

  // Summary
  container.appendChild(renderSetupSummary(v));
  container.appendChild(makeActions());
}

function sectionDoneSetup(section) {
  const conds = SETUP_CONDITIONS.filter(c => c.section === section && cfg.setupEnabled[c.id] !== false);
  return conds.every(c => {
    if (c.type === 'multi') return setupSt.et === 'valid';
    return setupSt[c.id] !== null && setupSt[c.id] !== undefined;
  });
}

function renderMultiCond(cond) {
  const wrap = document.createElement('div'); wrap.className='cond';

  // Auto-classification pill
  const autoRow = document.createElement('div');
  autoRow.style.cssText='display:flex;flex-direction:column;gap:6px;margin-bottom:4px';
  autoRow.innerHTML='<span style="font-size:11px;color:var(--text3)">AUTO-CLASSIFICATION</span>';
  const pill = document.createElement('div');
  const sc = setupSt.et === 'valid' ? (setupSt.sc.length > 0 ? 'A+' : 'A') : null;
  if (!sc) { pill.className='auto-result pending'; pill.textContent='○ Complete EMA touch first'; }
  else if (sc === 'A+') { pill.className='auto-result bull'; pill.textContent='✦ A+ Setup — EMA touch + confluence'; }
  else { pill.className='auto-result neut'; pill.textContent='◈ A Setup — EMA touch only'; }
  autoRow.appendChild(pill); wrap.appendChild(autoRow);

  const lbl = document.createElement('div');
  lbl.style.cssText='font-size:12px;color:var(--text2);margin-bottom:6px';
  lbl.textContent='Confluence — tick all that apply';
  wrap.appendChild(lbl);

  const mg = document.createElement('div'); mg.className='multi-grp';
  cond.options.forEach(opt => {
    const checked = setupSt.sc.includes(opt.key);
    const row = document.createElement('div'); row.className='mchk'+(checked?' checked':'');
    row.innerHTML=`<div class="mchk-box">${checked?'✓':''}</div><span class="mchk-lbl">${opt.label}</span>`;
    row.onclick=()=>{
      if (setupSt.sc.includes(opt.key)) setupSt.sc=setupSt.sc.filter(k=>k!==opt.key);
      else setupSt.sc.push(opt.key);
      saveAll(); renderAll();
    };
    mg.appendChild(row);
  });
  wrap.appendChild(mg);
  return wrap;
}

function renderSetupSummary(v) {
  const wrap = document.createElement('div'); wrap.className='sum-sec';
  const hdr = document.createElement('div'); hdr.className='sum-hdr';
  hdr.innerHTML='<h2>Setup verdict</h2>';
  const pill = document.createElement('span'); pill.className='out-pill out-'+v.vclass; pill.textContent=v.verdict;
  hdr.appendChild(pill); wrap.appendChild(hdr);

  const body = document.createElement('div'); body.className='sum-body';

  // Score bar
  let score=0;
  if (setupSt.g1==='pass') score+=30;
  if (v.clCls==='full') score+=30; else if (v.clCls==='reduced') score+=15;
  if (setupSt.et==='valid') score+=30;
  if (setupSt.rb==='yes') score+=5;

  const sr = document.createElement('div'); sr.className='score-row';
  sr.innerHTML=`<span class="score-lbl">Score</span><div class="score-track"><div class="score-fill-inner" style="width:${score}%"></div></div><span class="score-val">${score}%</span>`;
  body.appendChild(sr);

  // Items
  const items = document.createElement('div'); items.className='sum-items';
  const add=(lbl,val,cls)=>{ const d=document.createElement('div'); d.className='sum-item'; d.innerHTML=`<span>${lbl}</span><span class="sbadge ${cls}">${val}</span>`; items.appendChild(d); };
  if (setupSt.g1) add('Gate 1 — Permission', setupSt.g1==='pass'?'Pass':'FAIL', setupSt.g1==='pass'?'b':'s');
  if (setupSt.cl) add('Gate 2 — Candle Language', setupSt.cl, setupSt.cl==='Supportive'?'b':setupSt.cl==='Contradictory'?'s':'n');
  if (setupSt.et) add('EMA Touch', setupSt.et==='valid'?'Valid':setupSt.et==='too-far'?'Too far':'Broken', setupSt.et==='valid'?'b':'s');
  if (v.setupClass) add('Setup Class', v.setupClass, v.setupClass==='A+'?'b':'n');
  if (setupSt.sc.length) add('Confluence', setupSt.sc.length+' type(s)', 'b');
  if (setupSt.rb) add('Roadblock (½wt)', setupSt.rb==='yes'?'Identified':'None', setupSt.rb==='yes'?'b':'n');
  body.appendChild(items);

  // Note
  const pair = session.pair||'this pair';
  const note = document.createElement('div'); note.className='sum-note';
  let txt='';
  const sess=[session.pair,session.dir,session.tfPair].filter(Boolean).join(' · ');
  if (sess) txt=sess+'\n\n';
  if (v.vclass==='PENDING') txt+='Complete the checklist to generate your setup verdict.';
  else if (v.vclass==='NO-TRADE') txt+=v.g1fail?`Gate 1 failed on ${pair}. Permission TF is not aligned. Wait for alignment before looking at the setup TF.`:`Gate 2 failed on ${pair}. Candle language is Contradictory. The opposing side is in control on the HTF. No trade.`;
  else if (v.vclass==='WAIT') txt+=`Gates passed on ${pair}. Waiting for price to reach the 21 EMA on the setup TF${setupSt.et==='broken'?' — EMA already broken, setup invalidated':''}.`;
  else {
    const probeStr=v.probe; const clStr=setupSt.cl;
    txt+=`${v.setupClass} setup on ${pair}. Both gates passed. Valid EMA touch. Candle language ${clStr} — ${probeStr} probe. Score: ${score}%.`;
    if (setupSt.rb==='yes') txt+='\nRoadblock level identified — consider extended target.';
    txt+='\n\nProceed to Entry tab ↑';
  }
  note.textContent=txt; body.appendChild(note);
  wrap.appendChild(body);
  return wrap;
}

/* ══════════════════════════════════════════
   ENTRY TAB
══════════════════════════════════════════ */
function renderEntry() {
  const container = document.getElementById('pageContent');
  container.innerHTML = '';

  if (!setupPassed()) {
    const b = document.createElement('div'); b.className='entry-locked-banner show';
    b.innerHTML='<p>Complete a valid setup first.</p><strong>⛔ Entry is locked until setup passes</strong>';
    container.appendChild(b);
    return;
  }

  // Setup class context banner
  const sv = getSetupVerdict();
  const ctx = document.createElement('div');
  ctx.style.cssText='margin:8px 10px 0;padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);font-size:12px;color:var(--text2)';
  ctx.innerHTML=`Setup passed: <strong style="color:var(--accent)">${sv.setupClass} — ${sv.probe} Probe</strong> · ${[session.pair,session.dir,session.tfPair].filter(Boolean).join(' · ')}`;
  container.appendChild(ctx);

  // Progress
  const enabled = ENTRY_CONDITIONS.filter(c => cfg.entryEnabled[c.id] !== false);
  const answered = enabled.filter(c => entrySt[c.id] !== null && entrySt[c.id] !== undefined);
  const pct = enabled.length ? Math.round(answered.length / enabled.length * 100) : 0;
  container.appendChild(makeProgress(answered.length, enabled.length, pct, 'entry'));

  let lastSection='';
  ENTRY_CONDITIONS.forEach(cond => {
    if (cfg.entryEnabled[cond.id] === false) return;
    if (cond.section !== lastSection) {
      lastSection = cond.section;
      const sec = document.createElement('div'); sec.className='sec';
      const hdr = document.createElement('div'); hdr.className='sec-hdr'; hdr.style.cursor='default';
      const isDone = ENTRY_CONDITIONS.filter(c=>c.section===cond.section && cfg.entryEnabled[c.id]!==false).every(c=>entrySt[c.id]!==null && entrySt[c.id]!==undefined);
      hdr.innerHTML=`<span class="sec-lbl">${cond.section}</span><div class="sec-badge"><span class="badge ${isDone?'done':''}">${isDone?'✓':'—'}</span></div>`;
      sec.appendChild(hdr);
      const body = document.createElement('div'); body.className='sec-body';
      sec.appendChild(body);
      container.appendChild(sec);
    }
    const body = container.lastChild.querySelector('.sec-body');
    const currentLabel = getCurrentLabel(cond, entrySt[cond.id]);
    body.appendChild(makeCond(cond, currentLabel, (val) => {
      entrySt[cond.id] = val ? cond.stored[cond.answers.indexOf(val)] : null;
      saveAll(); renderAll();
    }));
  });

  container.appendChild(renderEntrySummary());
  container.appendChild(makeActions());
}

function renderEntrySummary() {
  const wrap = document.createElement('div'); wrap.className='sum-sec';
  const hdr = document.createElement('div'); hdr.className='sum-hdr';
  hdr.innerHTML='<h2>Entry verdict</h2>';

  const etfOk = entrySt.ema_etf === 'yes';
  const entryReached = entrySt.entry_opt === 'ema' || entrySt.entry_opt === 'retest';
  const stopPlaced = entrySt.stop === 'yes';
  const type1ok = entrySt.etype === 'type1' && entrySt.struct === 'yes';
  const type2ok = entrySt.etype === 'type2' && entrySt.s123 === 'yes';
  const confirmOk = type1ok || type2ok;
  const etfFail = entrySt.ema_etf === 'invalid';

  let verdict, vclass;
  if (!entrySt.ema_etf) { verdict='Pending'; vclass='PENDING'; }
  else if (etfFail) { verdict='Invalidated'; vclass='NO-ENTRY'; }
  else if (!etfOk) { verdict='Waiting — EMA break'; vclass='ENTER-WAIT'; }
  else if (!confirmOk) { verdict='Waiting — Confirmation'; vclass='ENTER-WAIT'; }
  else if (!entryReached) { verdict='Waiting — Entry level'; vclass='ENTER-WAIT'; }
  else if (!stopPlaced) { verdict='Place stop loss'; vclass='ENTER-WAIT'; }
  else { verdict='Enter ✓'; vclass='ENTER'; }

  const pill = document.createElement('span'); pill.className='out-pill out-'+vclass; pill.textContent=verdict;
  hdr.appendChild(pill); wrap.appendChild(hdr);

  const body = document.createElement('div'); body.className='sum-body';
  const items = document.createElement('div'); items.className='sum-items';
  const add=(lbl,val,cls)=>{ const d=document.createElement('div'); d.className='sum-item'; d.innerHTML=`<span>${lbl}</span><span class="sbadge ${cls}">${val}</span>`; items.appendChild(d); };
  if (entrySt.ema_etf) add('Entry TF EMA break', etfOk?'Confirmed':etfFail?'Invalidated':'Not yet', etfOk?'b':etfFail?'s':'n');
  if (entrySt.etype) add('Confirmation type', entrySt.etype==='type1'?'Type 1':'Type 2', 'b');
  if (entrySt.struct && entrySt.struct!=='na') add('Structure break', entrySt.struct==='yes'?'Confirmed':'Not yet', entrySt.struct==='yes'?'b':'n');
  if (entrySt.s123 && entrySt.s123!=='na') add('1-2-3 sequence', entrySt.s123==='yes'?'Complete':'In progress', entrySt.s123==='yes'?'b':'n');
  if (entrySt.entry_opt) add('Entry level', entrySt.entry_opt==='ema'?'EMA pullback':entrySt.entry_opt==='retest'?'Structure retest':'Waiting', entrySt.entry_opt!=='waiting'?'b':'n');
  if (entrySt.stop) add('Stop loss', entrySt.stop==='yes'?'Placed':'Not placed', entrySt.stop==='yes'?'b':'n');
  body.appendChild(items);

  const note = document.createElement('div'); note.className='sum-note';
  const sv = getSetupVerdict();
  const pair = session.pair||'this pair';
  let txt=[session.pair,session.dir,session.tfPair].filter(Boolean).join(' · ');
  if (txt) txt+='\n\n';
  if (vclass==='PENDING') txt+='Complete entry conditions above.';
  else if (vclass==='NO-ENTRY') txt+=`Entry TF EMA has been invalidated on ${pair}. Setup is over — reset and look for the next setup.`;
  else if (vclass==='ENTER-WAIT') txt+=`${sv.setupClass} setup on ${pair} — waiting for entry. ${!etfOk?'Watch for entry TF EMA break.':!confirmOk?'Watch for '+( entrySt.etype==='type1'?'structure break on entry TF.':'1-2-3 sequence to complete.'):'Entry level not yet reached — do not chase. Wait for EMA pullback or structure retest.'}`;
  else txt+=`All entry conditions met on ${pair}. ${sv.setupClass} ${sv.probe} probe. ${entrySt.etype==='type1'?'Type 1 confirmation':'Type 2 confirmation'} — ${entrySt.entry_opt==='ema'?'entered from EMA pullback':'entered from structure retest'}. Stop placed. Manage the trade.`;
  note.textContent=txt; body.appendChild(note);
  wrap.appendChild(body);
  return wrap;
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function getCurrentLabel(cond, storedVal) {
  if (!storedVal) return null;
  const idx = cond.stored.indexOf(storedVal);
  return idx >= 0 ? cond.answers[idx] : null;
}

function makeCond(cond, currentLabel, onChange) {
  const bias = currentLabel ? cond.biases[cond.answers.indexOf(currentLabel)] : null;
  const iconClass = bias==='bull'?'bull':bias==='block'?'block':bias==='bear'?'bear':bias==='neut'?'neut':'';
  const iconChar = bias==='bull'?'▲':bias==='block'||bias==='bear'?'▼':bias==='neut'?'─':'';
  const div = document.createElement('div'); div.className='cond';
  div.innerHTML=`<div class="cond-top"><div class="cond-icon ${iconClass}">${iconChar}</div><div class="cond-txt">${cond.label}<small>${cond.hint}</small></div></div><div class="ans-grp" id="ag_${cond.id}"></div>`;
  const ag = div.querySelector(`#ag_${cond.id}`);
  cond.answers.forEach((lbl, i) => {
    const bclass = cond.biases[i]==='bull'?'sel-bull':cond.biases[i]==='block'?'sel-block':cond.biases[i]==='bear'?'sel-bear':'sel-neut';
    const btn = document.createElement('button'); btn.className='abtn';
    if (currentLabel===lbl) btn.classList.add(bclass);
    btn.textContent=lbl;
    btn.onclick=()=>onChange(currentLabel===lbl?null:lbl);
    ag.appendChild(btn);
  });
  return div;
}

function makeProgress(done, total, pct, type) {
  const div = document.createElement('div'); div.className='prog-wrap';
  div.innerHTML=`<div class="prog-lbl"><span>${done} of ${total} answered</span><span>${pct}%</span></div><div class="prog-track"><div class="prog-fill ${type}" style="width:${pct}%"></div></div>`;
  return div;
}

function makeActions() {
  const div = document.createElement('div'); div.className='actions';
  div.innerHTML=`<button class="btn primary" onclick="shareSession()">⬡ Share / Save</button>`;
  const spacer = document.createElement('div'); spacer.className='spacer';
  const wrap = document.createElement('div');
  wrap.appendChild(div); wrap.appendChild(spacer);
  return wrap;
}

/* ══════════════════════════════════════════
   RESET / SHARE
══════════════════════════════════════════ */
function resetAll() {
  if (!confirm('Clear all answers for this session?')) return;
  setupSt = {g1:null,cl:null,et:null,sc:[],rb:null};
  entrySt = {ema_etf:null,etype:null,struct:null,s123:null,entry_opt:null,stop:null};
  session = {pair:'',dir:'',tfPair:''};
  saveAll(); switchTab('setup'); showToast('Session cleared');
}
function shareSession() {
  const note = document.querySelector('.sum-note');
  const txt = note ? note.textContent : 'No verdict yet';
  if (navigator.share) navigator.share({title:'Trade Checklist',text:txt}).catch(()=>{});
  else navigator.clipboard.writeText(txt).then(()=>showToast('Copied to clipboard'));
}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ══════════════════════════════════════════
   PWA
══════════════════════════════════════════ */
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBanner').style.display='flex';});
window.addEventListener('appinstalled',()=>{document.getElementById('installBanner').style.display='none';installPrompt=null;});
function doInstall(){if(!installPrompt)return;installPrompt.prompt();installPrompt.userChoice.then(()=>{installPrompt=null;});}

/* ══════════════════════════════════════════
   BOOT
══════════════════════════════════════════ */
loadAll();
populateSessionBar();
renderAll();
</script>
</body>
</html>
